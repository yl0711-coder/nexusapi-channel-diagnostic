name: Verify channel diagnostic release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: channel-diagnostic-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test package and container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install isolated browser dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/playwright" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            playwright@1.63.0
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run complete offline acceptance suite
        shell: bash
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          set -Eeuo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/playwright/node_modules/playwright"
          python -B scripts/test_all.py --output "$RUNNER_TEMP/acceptance"

      - name: Build candidate image
        run: docker build --tag hourly-channel-diagnostic:ci .

      - name: Verify candidate image CLI
        run: docker run --rm --entrypoint python hourly-channel-diagnostic:ci -B manage.py --help

      - name: Verify report control API wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          state_dir="$RUNNER_TEMP/control-state"
          project_name="channel-diagnostic-control-ci"
          mkdir -p "$state_dir/data" "$state_dir/reports"
          chmod 700 "$state_dir" "$state_dir/data" "$state_dir/reports"
          cat > "$state_dir/config.json" <<'JSON'
          {"timezone":"Asia/Shanghai","rounds":1,"juice_runs":1,"test_models":["gpt-5.6-sol","gpt-6-astra"],"data_dir":"data","channels":[]}
          JSON
          cat > "$state_dir/credentials.json" <<'JSON'
          {"credentials":{}}
          JSON
          chmod 600 "$state_dir/config.json" "$state_dir/credentials.json"
          export COMPOSE_PROJECT_NAME="$project_name"
          export DIAGNOSTIC_STATE_DIR="$state_dir"
          export DIAGNOSTIC_IMAGE=hourly-channel-diagnostic:ci
          export DIAGNOSTIC_CONTROL_TOKEN=synthetic-ci-token
          export DIAGNOSTIC_UID="$(id -u)" DIAGNOSTIC_GID="$(id -g)"
          compose=(docker compose --profile monitor)
          cleanup() {
            "${compose[@]}" down --remove-orphans || true
          }
          trap cleanup EXIT
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$state_dir:/state" \
            hourly-channel-diagnostic:ci \
            hourly_channel_diagnostic.py report \
            --config /state/config.json \
            --data-dir /state/data \
            --output /state/reports/report.html
          "${compose[@]}" config --quiet
          "${compose[@]}" up --detach --no-build
          for _ in $(seq 1 30); do
            report_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8097/report.html || true)"
            status_code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8097/api/status || true)"
            if [ "$report_code" = 200 ] && [ "$status_code" = 200 ]; then
              break
            fi
            sleep 1
          done
          test "$report_code" = 200
          test "$status_code" = 200
          for path in config.json credentials.json data/diagnostic.sqlite3; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8097/$path")" = 404
          done
          unauth_code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8097/api/stop)"
          test "$unauth_code" = 403
          auth_code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'X-Control-Token: synthetic-ci-token' http://127.0.0.1:8097/api/stop)"
          test "$auth_code" = 200

      - name: Verify release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python -B scripts/build_release.py --output "$RUNNER_TEMP/release"
          archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -n "$archive"
          unzip -t "$archive"
          cd "$RUNNER_TEMP/release"
          sha256sum --check "$(basename "$archive").sha256"
